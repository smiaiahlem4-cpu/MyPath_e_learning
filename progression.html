<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="./images/Logo_MyPath_header.png">
  <link rel="stylesheet" href="style.css">
  <title>MyPath – Progression</title>
</head>
<body data-page="progression">
  <a class="skip-link" href="#contenu">Aller au contenu</a>

  <aside class="sidebar" id="menu">
    <img class="logo" src="./images/Logo_MyPath.png" alt="Logo MyPath">
    <nav class="menu-links" aria-label="Navigation principale">
      <a href="index.html">Accueil</a>
      <a href="progression.html" aria-current="page">Progression</a>
    </nav>
  </aside>

  <div class="content">
    <header class="navbar">
      <button class="burger" type="button" aria-label="Ouvrir le menu" aria-controls="menu" aria-expanded="false">&#9776;</button>
      <div class="search">
        <label class="visually-hidden" for="search">Rechercher un cours</label>
        <input class="search-input" id="search" type="search" placeholder="Search...">
        <button class="search-button" type="button">Search</button>
      </div>
      <div class="profile">
        <img class="profile-img" src="./images/profile.webp" alt="Profil">
        <p class="profile-name">Student</p>
      </div>
    </header>

    <main class="main course-main" id="contenu">
      <h1 class="page-title">Ma progression</h1>

      <section class="progress-panel" aria-label="Progression globale">
        <p class="progress-text" aria-live="polite"><span data-progress-text>0 cours terminé sur 20 (0 %)</span></p>
        <progress class="progress-bar" max="100" value="0" aria-label="Progression globale">0 %</progress>
      </section>

      <section class="lesson" aria-labelledby="done-title">
        <h2 id="done-title">Cours terminés (<span id="done-count">0</span>)</h2>
        <ul class="course-list" id="done-list"></ul>
        <p id="done-empty">Aucun cours terminé pour le moment.</p>
      </section>

      <section class="lesson" aria-labelledby="todo-title">
        <h2 id="todo-title">Cours restants (<span id="todo-count">0</span>)</h2>
        <ul class="course-list" id="todo-list"></ul>
        <p id="todo-empty" hidden>Bravo, tous les cours sont terminés !</p>
      </section>

      <div class="course-actions">
        <button class="btn-reset" id="reset" type="button">Réinitialiser ma progression</button>
      </div>
    </main>
  </div>

  <script src="courses.js"></script>
  <script src="script.js"></script>
</body>
</html>
